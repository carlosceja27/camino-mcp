[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "camino-mcp"
version = "0.1.0"
description = "Local read-only Camino Canvas MCP server"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
camino-mcp = "camino_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camino_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
